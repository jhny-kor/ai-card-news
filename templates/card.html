<!doctype html>
<meta charset="utf-8">
<title>card</title>
<!-- 모든 템플릿이 공유하는 골격. 스타일은 template.css가 주입된다. PLAN.md 3.2 -->
<style>
  /* 번들 폰트 — 전부 SIL Open Font License 1.1. 상업 배포 소프트웨어 번들 허용.
     시스템 폰트에 기대면 "기본값 느낌"이 나고 맥/윈도우 결과가 달라진다. fonts/README.md 참고 */
  @font-face { font-family: "Pretendard"; font-weight: 100 900; font-display: block;
               src: url("../fonts/PretendardVariable.woff2") format("woff2-variations"); }
  @font-face { font-family: "Nanum Myeongjo"; font-weight: 400; font-display: block;
               src: url("../fonts/NanumMyeongjo-Regular.woff2") format("woff2"); }
  @font-face { font-family: "Nanum Myeongjo"; font-weight: 700 900; font-display: block;
               src: url("../fonts/NanumMyeongjo-ExtraBold.woff2") format("woff2"); }
  @font-face { font-family: "Nanum Pen"; font-weight: 400; font-display: block;
               src: url("../fonts/NanumPenScript-Regular.woff2") format("woff2"); }
</style>
<link id="tpl" rel="stylesheet" href="">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1080px; overflow: hidden; }
  body { position: relative; word-break: keep-all; }
  #bg { position: absolute; inset: 0; background-size: cover; background-position: center; }
  #scrim { position: absolute; inset: 0; }
  #wrap { position: relative; height: 100%; display: flex; flex-direction: column; }
  #items > div, #rows > div { display: block; }
  .hide { display: none !important; }
</style>

<div id="bg"></div><div id="scrim"></div>
<div id="wrap">
  <div id="kicker"></div>
  <h1 id="title"></h1>
  <p id="body"></p>
  <ol id="items"></ol>
  <div id="rows"></div>
  <div id="page"></div>
</div>

<script>
const $ = (id) => document.getElementById(id);

/** 스타일시트 교체를 기다린다. href가 그대로면 load 이벤트가 안 오므로 즉시 통과시킨다. */
function loadCss(href) {
  const link = $("tpl");
  if (!href || link.getAttribute("href") === href) return Promise.resolve();
  return new Promise((resolve) => {
    link.addEventListener("load", resolve, { once: true });
    link.addEventListener("error", resolve, { once: true });
    link.href = href;
    setTimeout(resolve, 3000);                        // 안전장치
  });
}

/** 배경 이미지 디코드까지 기다린다. 안 기다리면 이미지 없는 프레임이 캡처된다. */
function loadImage(src) {
  if (!src) return Promise.resolve();
  const img = new Image();
  img.src = src;
  return img.decode().catch(() => {});
}

async function render(d) {
  document.body.className = `layout-${d.layout || "statement"}`;
  await loadCss(d.css || "");

  $("title").textContent = d.title || "";
  $("kicker").textContent = d.kicker || "";
  $("page").textContent = d.total > 1 ? `${d.page} / ${d.total}` : "";

  const lines = String(d.body || "").split("\n").map((s) => s.trim()).filter(Boolean);
  const isList = d.layout === "list";
  const isCompare = d.layout === "compare";

  $("body").textContent = isList || isCompare ? "" : (d.body || "");
  $("items").innerHTML = isList ? lines.map((t) => `<li>${esc(t)}</li>`).join("") : "";
  $("rows").innerHTML = isCompare ? lines.map((t) => `<div>${esc(t)}</div>`).join("") : "";

  $("body").classList.toggle("hide", isList || isCompare || !d.body);
  $("items").classList.toggle("hide", !isList);
  $("rows").classList.toggle("hide", !isCompare);
  $("kicker").classList.toggle("hide", !d.kicker);
  $("page").classList.toggle("hide", !(d.total > 1) || d.layout === "cover");

  // 배경 이미지: 추출본이든 생성본이든 같은 필터를 먹여 한 벌처럼 보이게 한다 (PLAN.md 4.2)
  const hasBg = Boolean(d.image);
  $("bg").style.backgroundImage = hasBg ? `url("${d.image}")` : "";
  document.body.classList.toggle("has-bg", hasBg);

  // 제목 길이로 크기 결정. 실측 축소 루프는 넣지 않는다 — 프롬프트가 20자로 제한한다.
  const n = (d.title || "").length;
  document.documentElement.style.setProperty("--title-scale", n > 22 ? 0.62 : n > 14 ? 0.8 : 1);
  document.documentElement.style.setProperty("--lines", lines.length || 1);

  await loadImage(hasBg ? d.image : null);
  await document.fonts.ready;
  return settled();
}

function esc(s) {
  return s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
}

/** 렌더 완료 신호 — main이 이걸 기다린 뒤 캡처한다. 3프레임을 넘겨야 합성기까지 반영된다. */
function settled() {
  return new Promise((r) => {
    let n = 3;
    const tick = () => (--n > 0 ? requestAnimationFrame(tick) : r(true));
    requestAnimationFrame(tick);
  });
}
</script>
