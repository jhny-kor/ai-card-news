<!doctype html>
<meta charset="utf-8">
<!-- 이 화면은 외부 리소스를 전혀 쓰지 않는다. 폐쇄망 배포이므로 명시적으로 잠근다. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'none'">
<title>카드뉴스 생성기</title>
<style>
  /* 번들 폰트 — 전부 SIL Open Font License 1.1. 상업 배포 소프트웨어 번들 허용.
     시스템 폰트에 기대면 "기본값 느낌"이 나고 맥/윈도우 결과가 달라진다. fonts/README.md 참고 */
  @font-face { font-family: "Pretendard"; font-weight: 100 900; font-display: block;
               src: url("../../fonts/PretendardVariable.woff2") format("woff2-variations"); }
</style>

<style>
  :root {
    --bg: #ffffff; --fg: #1c1f24; --dim: #6b7280; --line: #e2e5ea;
    --accent: #1b4d3e; --field: #f7f8fa; --warn: #9a3412;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16181c; --fg: #e8eaed; --dim: #9aa0a8; --line: #2a2e35;
            --accent: #7dd3a8; --field: #1f232a; --warn: #fca55e; }
  }
  * { box-sizing: border-box; }
  /* 설정만 스크롤하고 실행·로그는 항상 아래에 붙어 있게 한다. 창을 줄여도 진행 상황이 가린다 */
  body { margin: 0; padding: 16px 22px 16px; background: var(--bg); color: var(--fg);
         font: 14px/1.5 "Pretendard", -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
         height: 100vh; display: flex; flex-direction: column; }
  #top { overflow-y: auto; flex: 1 1 auto; min-height: 0; padding-right: 4px; }
  #bottom { flex: 0 0 auto; padding-top: 4px; }
  h2 { font-size: 13px; letter-spacing: .04em; color: var(--dim); margin: 15px 0 8px;
       text-transform: uppercase; font-weight: 700; }
  h2:first-child { margin-top: 0; }
  .row { display: grid; grid-template-columns: 92px 1fr auto; gap: 8px; align-items: center; margin-bottom: 6px; }
  .row > label { color: var(--dim); font-size: 13px; }
  input, select, button { font: inherit; color: var(--fg); }
  input[type=text], input[type=password], input[type=number], select {
    background: var(--field); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; width: 100%; }
  input[type=number] { width: 90px; }
  button { background: var(--field); border: 1px solid var(--line); border-radius: 6px;
           padding: 7px 14px; cursor: pointer; white-space: nowrap; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 700; }
  .inline { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .note { color: var(--dim); font-size: 12px; }
  .warn { color: var(--warn); }
  #gallery { display: flex; gap: 10px; flex-wrap: wrap; }
  #gallery label { border: 2px solid var(--line); border-radius: 8px; padding: 6px; cursor: pointer;
                   width: 122px; text-align: center; }
  #gallery label.sel { border-color: var(--accent); }
  #gallery img { width: 108px; height: 108px; border-radius: 4px; display: block; background: var(--field); }
  #gallery .nm { font-size: 12px; font-weight: 600; margin-top: 6px; }
  #gallery .ds { font-size: 11px; color: var(--dim); line-height: 1.35; }
  #gallery .im { font-size: 10px; color: var(--accent); margin-top: 3px; font-weight: 600; }
  #gallery input { display: none; }
  #log { background: var(--field); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px;
         height: 158px; overflow: auto; white-space: pre-wrap; font-size: 12px;
         font-family: ui-monospace, "SF Mono", Consolas, monospace; }
  #files { color: var(--dim); font-size: 12px; }
</style>

<div id="top">
<h2>서버 (Open WebUI)</h2>
<div class="row"><label>주소</label><input type="text" id="baseUrl" placeholder="https://ai.example.kr  (/api/v1 까지 붙여넣어도 됩니다)"><span></span></div>
<div class="row"><label>API 키</label><input type="password" id="apiKey" placeholder="sk-..."><span></span></div>
<div class="row"><label>문안 모델</label><select id="model"></select><button id="loadModels">목록 조회</button></div>
<div class="row">
  <label>이미지</label>
  <div class="inline">
    <label class="note"><input type="checkbox" id="generateImages"> 부족분 생성</label>
    <select id="imageModel" style="width:auto;min-width:150px"></select>
    <label class="note">최대 <input type="number" id="maxGenerate" min="1" max="10"> 장</label>
  </div>
  <button id="loadImage">확인</button>
</div>
<div class="row"><label></label><span class="note" id="backend">자료의 이미지를 먼저 쓰고, 모자랄 때만 생성합니다.</span><span></span></div>

<h2>자료</h2>
<div class="inline">
  <button id="pick">파일 선택</button>
  <span id="files">선택된 자료 없음</span>
</div>

<h2>문안</h2>
<div class="row"><label>카드 수</label><div class="inline">
  <input type="number" id="cards" min="3" max="12">
  <select id="flow" style="width:auto"><option value="list">나열형 (도입-정보-정리)</option><option value="story">스토리텔링형 (why-how-what)</option></select>
</div><span></span></div>
<div class="row"><label>톤</label><input type="text" id="tone" placeholder="예: 친근하고 쉬운 말투"><span></span></div>
<div class="row"><label>저장 위치</label><input type="text" id="outDir"><button id="pickDir">변경</button></div>

<h2>템플릿</h2>
<div id="gallery"></div>
<div class="inline" style="margin-top:10px">
  <label class="note">글꼴</label>
  <select id="font" style="width:auto;min-width:170px"></select>
  <span class="note" id="fontNote">템플릿마다 어울리는 조합만 나옵니다.</span>
</div>

</div>

<div id="bottom">
<h2>실행</h2>
<div class="inline" style="margin-bottom:10px">
  <button class="primary" id="go">카드뉴스 만들기</button>
  <button id="openOut" disabled>결과 폴더 열기</button>
</div>
<div id="log"></div>
</div>

<script src="ui.js"></script>
