appId: kr.local.cardnews
productName: CardNews
copyright: ""

directories:
  output: dist
  buildResources: build

files:
  - src/**/*
  - templates/**/*
  - fonts/**/*
  - package.json
  - "!**/*.map"

# mupdf는 WASM을 파일로 읽는다. asar 안에 있으면 로드에 실패할 수 있어 풀어둔다.
asar: true
asarUnpack:
  - "**/node_modules/mupdf/**"

win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: cardnews-setup-${version}.exe
  # 서명 안 함. 반입 후 SmartScreen 경고가 뜬다 (README 참고)
  signAndEditExecutable: false

nsis:
  oneClick: false
  # 기본은 사용자 폴더 설치(관리자 권한 불필요)지만, 설치 화면에서 "모든 사용자"를 고를 수 있다.
  # AppLocker 같은 정책이 %LOCALAPPDATA% 실행을 막는 PC에서는 Program Files 설치가 유일한 길이다.
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 카드뉴스 생성기
  deleteAppDataOnUninstall: false
  runAfterFinish: false

mac:
  target: [dmg]
  category: public.app-category.productivity
  artifactName: cardnews-${version}.dmg
